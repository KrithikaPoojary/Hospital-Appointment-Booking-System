<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle text-primary display-4"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted">Sign in to manage your appointments</p>
                </div>

                <div id="alertContainer"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" id="username" class="form-control" required placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">Don't have an account? <a href="/register" class="fw-semibold text-primary">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Signing in...';

        const payload = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const data = await API.request('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (data && data.token) {
                API.setSession(data.token, data);
                if (data.role === 'ADMIN') {
                    window.location.href = '/admin';
                } else if (data.role === 'DOCTOR') {
                    window.location.href = '/doctor/slots';
                } else {
                    window.location.href = '/appointments';
                }
            }
        } catch (err) {
            showAlert(err.message, 'danger');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign In';
        }
    });
</script>
</body>
</html>
