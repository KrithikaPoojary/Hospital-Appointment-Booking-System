<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">My Appointments</h2>
            <p class="text-muted mb-0">Track, reschedule, or cancel your scheduled hospital visits</p>
        </div>
        <a href="/doctors" class="btn btn-primary fw-semibold">
            <i class="bi bi-plus-circle me-1"></i> Book New Appointment
        </a>
    </div>

    <div id="alertContainer"></div>

    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Doctor</th>
                        <th>Specialty</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            <div class="spinner-border text-primary spinner-border-sm me-2"></div> Loading your appointments...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Reschedule Modal -->
<div class="modal fade" id="rescheduleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Reschedule Appointment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="rescheduleAlert"></div>
                <p class="text-muted small">Choose a new available slot with your doctor:</p>
                <div id="newSlotsContainer" class="d-flex flex-wrap gap-2 mb-3"></div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Reason for Rescheduling</label>
                    <input type="text" id="rescheduleReason" class="form-control" placeholder="E.g., Schedule conflict">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="confirmRescheduleBtn" class="btn btn-warning" disabled>Confirm Reschedule</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    let activeAppointmentId = null;
    let selectedNewSlotId = null;
    let rescheduleModal = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (!API.isLoggedIn()) {
            window.location.href = '/login';
            return;
        }
        rescheduleModal = new bootstrap.Modal(document.getElementById('rescheduleModal'));
        loadAppointments();

        document.getElementById('confirmRescheduleBtn').addEventListener('click', handleReschedule);
    });

    async function loadAppointments() {
        const tbody = document.getElementById('appointmentsTableBody');
        try {
            const list = await API.request('/api/appointments/my-appointments');
            if (!list || list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            You have no appointments yet. <a href="/doctors" class="text-primary fw-semibold">Book one now!</a>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = list.map(app => `
                <tr>
                    <td class="fw-semibold text-dark">Dr. ${app.doctorName}</td>
                    <td><span class="badge badge-specialty">${app.specialty}</span></td>
                    <td>${app.appointmentDate}</td>
                    <td>${app.startTime.substring(0,5)} - ${app.endTime.substring(0,5)}</td>
                    <td><span class="badge status-${app.status}">${app.status}</span></td>
                    <td class="text-muted small">${app.notes || '—'}</td>
                    <td class="text-end">
                        ${app.status === 'BOOKED' || app.status === 'RESCHEDULED' ? `
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="openRescheduleModal(${app.id}, ${app.doctorId})">
                                Reschedule
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${app.id})">
                                Cancel
                            </button>
                        ` : `<span class="text-muted small">No actions</span>`}
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Failed to load appointments.</td></tr>';
        }
    }

    async function cancelAppointment(id) {
        if (!confirm('Are you sure you want to cancel this appointment? The slot will be freed.')) return;
        try {
            await API.request(`/api/appointments/${id}/cancel`, { method: 'PUT' });
            showAlert('Appointment cancelled successfully. A notice has been sent to your email.', 'info');
            loadAppointments();
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    async function openRescheduleModal(appointmentId, doctorId) {
        activeAppointmentId = appointmentId;
        selectedNewSlotId = null;
        document.getElementById('rescheduleAlert').innerHTML = '';
        document.getElementById('confirmRescheduleBtn').disabled = true;

        const container = document.getElementById('newSlotsContainer');
        container.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div> Loading available slots...';
        rescheduleModal.show();

        try {
            const slots = await API.request(`/api/slots/doctor/${doctorId}/available`);
            if (!slots || slots.length === 0) {
                container.innerHTML = '<span class="text-muted">No other open slots found for this doctor.</span>';
                return;
            }

            container.innerHTML = slots.map(slot => `
                <button type="button" class="btn btn-outline-secondary slot-btn" id="new-slot-${slot.id}" onclick="selectNewSlot(${slot.id})">
                    ${slot.slotDate} (${slot.startTime.substring(0,5)} - ${slot.endTime.substring(0,5)})
                </button>
            `).join('');
        } catch (e) {
            container.innerHTML = '<span class="text-danger">Failed to fetch slots.</span>';
        }
    }

    function selectNewSlot(slotId) {
        selectedNewSlotId = slotId;
        document.querySelectorAll('#newSlotsContainer .slot-btn').forEach(btn => {
            btn.classList.remove('btn-warning');
            btn.classList.add('btn-outline-secondary');
        });
        const target = document.getElementById(`new-slot-${slotId}`);
        if (target) {
            target.classList.remove('btn-outline-secondary');
            target.classList.add('btn-warning');
        }
        document.getElementById('confirmRescheduleBtn').disabled = false;
    }

    async function handleReschedule() {
        if (!selectedNewSlotId || !activeAppointmentId) return;
        const confirmBtn = document.getElementById('confirmRescheduleBtn');
        confirmBtn.disabled = true;

        const payload = {
            newSlotId: selectedNewSlotId,
            reason: document.getElementById('rescheduleReason').value.trim()
        };

        try {
            await API.request(`/api/appointments/${activeAppointmentId}/reschedule`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });

            showAlert('Appointment rescheduled successfully! Updated details sent to your email.', 'success');
            rescheduleModal.hide();
            loadAppointments();
        } catch (e) {
            document.getElementById('rescheduleAlert').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
            confirmBtn.disabled = false;
        }
    }
</script>
</body>
</html>
