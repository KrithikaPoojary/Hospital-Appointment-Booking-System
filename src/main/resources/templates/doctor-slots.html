<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Availability — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Doctor Slot & Schedule Management</h2>
        <p class="text-muted mb-0">Define consultation slots, track patient bookings, and update your medical bio</p>
    </div>

    <div id="alertContainer"></div>

    <div class="row g-4">
        <!-- Create New Slot Card -->
        <div class="col-lg-4">
            <div class="card card-custom p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-clock-history text-primary me-2"></i>Add Availability Slot</h5>
                <form id="createSlotForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Slot Date</label>
                        <input type="date" id="slotDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Start Time</label>
                        <input type="time" id="startTime" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">End Time</label>
                        <input type="time" id="endTime" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">Create Slot</button>
                </form>
            </div>

            <!-- Profile Settings -->
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-person-gear text-primary me-2"></i>Doctor Profile Info</h5>
                <form id="profileForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Specialty</label>
                        <input type="text" id="specialty" class="form-control" placeholder="e.g. Cardiology" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Qualification</label>
                        <input type="text" id="qualification" class="form-control" placeholder="e.g. MBBS, MD">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Experience (Years)</label>
                        <input type="number" id="experienceYears" class="form-control" min="0" value="5">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Bio / Summary</label>
                        <textarea id="bio" class="form-control" rows="3" placeholder="Brief background..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100 fw-semibold">Save Profile</button>
                </form>
            </div>
        </div>

        <!-- Slots List Table -->
        <div class="col-lg-8">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Scheduled Slots</h5>
                    <div class="d-flex align-items-center gap-2">
                        <label class="small text-muted fw-semibold">Filter Date:</label>
                        <input type="date" id="filterDate" class="form-control form-control-sm" style="width: 170px;">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="slotsTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Select a date or load slots...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    let currentDoctorId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const user = API.getUser();
        if (!user || user.role !== 'DOCTOR') {
            window.location.href = '/login';
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('slotDate').value = today;
        document.getElementById('slotDate').min = today;
        document.getElementById('filterDate').value = today;

        await loadDoctorProfile();

        document.getElementById('filterDate').addEventListener('change', (e) => {
            loadSlotsByDate(e.target.value);
        });

        document.getElementById('createSlotForm').addEventListener('submit', handleCreateSlot);
        document.getElementById('profileForm').addEventListener('submit', handleUpdateProfile);
    });

    async function loadDoctorProfile() {
        const user = API.getUser();
        try {
            const doctors = await API.request('/api/doctors');
            const match = doctors.find(d => d.userId === user.id);
            if (match) {
                currentDoctorId = match.id;
                document.getElementById('specialty').value = match.specialty || '';
                document.getElementById('qualification').value = match.qualification || '';
                document.getElementById('experienceYears').value = match.experienceYears || 5;
                document.getElementById('bio').value = match.bio || '';

                loadSlotsByDate(document.getElementById('filterDate').value);
            }
        } catch (e) {
            console.error('Error loading profile', e);
        }
    }

    async function loadSlotsByDate(date) {
        if (!currentDoctorId) return;
        const tbody = document.getElementById('slotsTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>';

        try {
            const slots = await API.request(`/api/slots/doctor/${currentDoctorId}/date?date=${date}`);
            if (!slots || slots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No slots scheduled for this day.</td></tr>';
                return;
            }

            tbody.innerHTML = slots.map(s => `
                <tr>
                    <td class="fw-semibold">${s.slotDate}</td>
                    <td>${s.startTime.substring(0,5)}</td>
                    <td>${s.endTime.substring(0,5)}</td>
                    <td>
                        <span class="badge ${s.available ? 'bg-success' : 'bg-secondary'}">
                            ${s.available ? 'Available' : 'Booked'}
                        </span>
                    </td>
                    <td class="text-end">
                        ${s.available ? `
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSlot(${s.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        ` : `<span class="text-muted small">Locked</span>`}
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Failed to fetch slots.</td></tr>';
        }
    }

    async function handleCreateSlot(e) {
        e.preventDefault();
        if (!currentDoctorId) {
            showAlert('Please save your doctor profile before adding slots.', 'warning');
            return;
        }

        const payload = {
            doctorId: currentDoctorId,
            slotDate: document.getElementById('slotDate').value,
            startTime: document.getElementById('startTime').value + ':00',
            endTime: document.getElementById('endTime').value + ':00'
        };

        try {
            await API.request('/api/slots', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            showAlert('Slot created successfully!', 'success');
            loadSlotsByDate(document.getElementById('filterDate').value);
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function handleUpdateProfile(e) {
        e.preventDefault();
        const payload = {
            specialty: document.getElementById('specialty').value.trim(),
            qualification: document.getElementById('qualification').value.trim(),
            experienceYears: parseInt(document.getElementById('experienceYears').value),
            bio: document.getElementById('bio').value.trim()
        };

        try {
            const updated = await API.request('/api/doctors/profile', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            currentDoctorId = updated.id;
            showAlert('Profile updated successfully!', 'success');
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Delete this unbooked slot?')) return;
        try {
            await API.request(`/api/slots/${id}`, { method: 'DELETE' });
            showAlert('Slot removed.', 'info');
            loadSlotsByDate(document.getElementById('filterDate').value);
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }
</script>
</body>
</html>
