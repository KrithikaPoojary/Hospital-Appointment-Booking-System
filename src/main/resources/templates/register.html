<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary display-4"></i>
                    <h3 class="fw-bold mt-2">Create an Account</h3>
                    <p class="text-muted">Register to search doctors and book slots</p>
                </div>

                <div id="alertContainer"></div>

                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" id="fullName" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" id="username" class="form-control" required placeholder="johndoe">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Account Role</label>
                            <select id="role" class="form-select">
                                <option value="PATIENT" selected>Patient</option>
                                <option value="DOCTOR">Doctor</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" id="email" class="form-control" required placeholder="john@example.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="+1234567890">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" class="form-control" minlength="6" required placeholder="Minimum 6 characters">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold mt-4">Create Account</button>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">Already have an account? <a href="/login" class="fw-semibold text-primary">Sign in here</a></small>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating account...';

        const payload = {
            fullName: document.getElementById('fullName').value.trim(),
            username: document.getElementById('username').value.trim(),
            role: document.getElementById('role').value,
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const data = await API.request('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            showAlert('Account created successfully! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } catch (err) {
            showAlert(err.message, 'danger');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Create Account';
        }
    });
</script>
</body>
</html>
