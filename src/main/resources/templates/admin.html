<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Administrative Reports & Dashboard</h2>
        <p class="text-muted mb-0">High-level clinic analytics, activity auditing, and global appointment records</p>
    </div>

    <div id="alertContainer"></div>

    <!-- Metrics Cards Row -->
    <div class="row g-3 mb-5" id="statsRow">
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 text-center border-start border-primary border-4">
                <h6 class="text-muted small fw-semibold text-uppercase">Total Patients</h6>
                <h3 class="fw-bold text-primary mb-0" id="statPatients">—</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 text-center border-start border-success border-4">
                <h6 class="text-muted small fw-semibold text-uppercase">Total Doctors</h6>
                <h3 class="fw-bold text-success mb-0" id="statDoctors">—</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 text-center border-start border-info border-4">
                <h6 class="text-muted small fw-semibold text-uppercase">Total Bookings</h6>
                <h3 class="fw-bold text-info mb-0" id="statAppointments">—</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 text-center border-start border-danger border-4">
                <h6 class="text-muted small fw-semibold text-uppercase">Cancellations</h6>
                <h3 class="fw-bold text-danger mb-0" id="statCancelled">—</h3>
            </div>
        </div>
    </div>

    <!-- Appointments Audit Table -->
    <div class="card card-custom p-4">
        <div class="row align-items-center mb-3 g-2">
            <div class="col-md-6">
                <h5 class="fw-bold mb-0">Hospital Appointments Log</h5>
            </div>
            <div class="col-md-6">
                <form id="dateFilterForm" class="d-flex gap-2 justify-content-md-end">
                    <input type="date" id="startDate" class="form-control form-control-sm">
                    <input type="date" id="endDate" class="form-control form-control-sm">
                    <button type="submit" class="btn btn-sm btn-primary">Filter</button>
                    <button type="button" id="resetFilterBtn" class="btn btn-sm btn-outline-secondary">Reset</button>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th class="text-end">Manage</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = API.getUser();
        if (!user || user.role !== 'ADMIN') {
            window.location.href = '/login';
            return;
        }

        loadDashboardStats();
        loadAppointments();

        document.getElementById('dateFilterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            loadAppointments(start, end);
        });

        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadAppointments();
        });
    });

    async function loadDashboardStats() {
        try {
            const stats = await API.request('/api/admin/dashboard');
            document.getElementById('statPatients').textContent = stats.totalPatients;
            document.getElementById('statDoctors').textContent = stats.totalDoctors;
            document.getElementById('statAppointments').textContent = stats.totalAppointments;
            document.getElementById('statCancelled').textContent = stats.cancelledAppointments;
        } catch (e) {
            console.error('Error loading dashboard metrics', e);
        }
    }

    async function loadAppointments(startDate = '', endDate = '') {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>';

        let url = '/api/admin/appointments';
        if (startDate && endDate) {
            url += `?startDate=${startDate}&endDate=${endDate}`;
        }

        try {
            const list = await API.request(url);
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No appointments found.</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(app => `
                <tr>
                    <td>#${app.id}</td>
                    <td class="fw-semibold">${app.patientName} <br><small class="text-muted">${app.patientEmail}</small></td>
                    <td>Dr. ${app.doctorName} <br><small class="text-muted">${app.specialty}</small></td>
                    <td>${app.appointmentDate}</td>
                    <td>${app.startTime.substring(0,5)} - ${app.endTime.substring(0,5)}</td>
                    <td><span class="badge status-${app.status}">${app.status}</span></td>
                    <td class="text-end">
                        <select class="form-select form-select-sm d-inline-block w-auto" onchange="changeStatus(${app.id}, this.value)">
                            <option value="">Update...</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Failed to load records.</td></tr>';
        }
    }

    async function changeStatus(id, newStatus) {
        if (!newStatus) return;
        try {
            await API.request(`/api/admin/appointments/${id}/status?status=${newStatus}`, { method: 'PUT' });
            showAlert(`Appointment #${id} updated to ${newStatus}.`, 'success');
            loadAppointments();
            loadDashboardStats();
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }
</script>
</body>
</html>
