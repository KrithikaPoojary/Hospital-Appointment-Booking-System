<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctors — MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2 class="fw-bold mb-1">Our Medical Specialists</h2>
            <p class="text-muted mb-0">Browse certified doctors and book real-time available slots</p>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
            <div class="row g-2">
                <div class="col-6">
                    <select id="specialtyFilter" class="form-select">
                        <option value="">All Specialties</option>
                    </select>
                </div>
                <div class="col-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by name...">
                </div>
            </div>
        </div>
    </div>

    <div id="alertContainer"></div>

    <!-- Doctors Grid -->
    <div class="row g-4" id="doctorsGrid">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading doctors...</p>
        </div>
    </div>
</main>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalDoctorName">Book Appointment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="modalAlert"></div>
                <h6 class="fw-bold mb-3">Available Appointment Slots:</h6>
                <div id="slotsContainer" class="d-flex flex-wrap gap-2 mb-4">
                    <p class="text-muted">Loading available slots...</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Optional Patient Notes / Symptoms</label>
                    <textarea id="patientNotes" class="form-control" rows="3" placeholder="Briefly describe your symptoms or reason for visit..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="confirmBookingBtn" class="btn btn-primary" disabled>Confirm Booking</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    let selectedSlotId = null;
    let bookingModal = null;

    document.addEventListener('DOMContentLoaded', () => {
        bookingModal = new bootstrap.Modal(document.getElementById('bookingModal'));
        loadSpecialties();
        loadDoctors();

        // Check URL params
        const urlParams = new URLSearchParams(window.location.search);
        const searchParam = urlParams.get('search');
        const specialtyParam = urlParams.get('specialty');
        if (searchParam) {
            document.getElementById('searchInput').value = searchParam;
            loadDoctors(searchParam);
        } else if (specialtyParam) {
            loadDoctorsBySpecialty(specialtyParam);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            loadDoctors(e.target.value.trim());
        });

        document.getElementById('specialtyFilter').addEventListener('change', (e) => {
            const spec = e.target.value;
            if (spec) {
                loadDoctorsBySpecialty(spec);
            } else {
                loadDoctors();
            }
        });

        document.getElementById('confirmBookingBtn').addEventListener('click', handleBooking);
    });

    async function loadSpecialties() {
        try {
            const list = await API.request('/api/doctors/specialties');
            const select = document.getElementById('specialtyFilter');
            list.forEach(sp => {
                const opt = document.createElement('option');
                opt.value = sp;
                opt.textContent = sp;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('Failed to load specialties', e);
        }
    }

    async function loadDoctors(search = '') {
        try {
            const url = search ? `/api/doctors?search=${encodeURIComponent(search)}` : '/api/doctors';
            const doctors = await API.request(url);
            renderDoctors(doctors);
        } catch (e) {
            document.getElementById('doctorsGrid').innerHTML = `
                <div class="col-12 text-center text-muted py-5">Unable to load doctors.</div>
            `;
        }
    }

    async function loadDoctorsBySpecialty(specialty) {
        try {
            const doctors = await API.request(`/api/doctors/specialty/${encodeURIComponent(specialty)}`);
            renderDoctors(doctors);
        } catch (e) {
            document.getElementById('doctorsGrid').innerHTML = `
                <div class="col-12 text-center text-muted py-5">No doctors found for ${specialty}.</div>
            `;
        }
    }

    function renderDoctors(doctors) {
        const grid = document.getElementById('doctorsGrid');
        if (!doctors || doctors.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No doctors found matching criteria.</div>';
            return;
        }

        grid.innerHTML = doctors.map(doc => `
            <div class="col-md-6 col-lg-4">
                <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0 text-dark">Dr. ${doc.fullName}</h5>
                            <span class="badge badge-specialty">${doc.specialty}</span>
                        </div>
                        <p class="text-muted small mb-2"><i class="bi bi-mortarboard me-1"></i> ${doc.qualification || 'Certified Medical Practitioner'}</p>
                        <p class="text-muted small mb-3"><i class="bi bi-clock-history me-1"></i> ${doc.experienceYears || 5}+ Years Experience</p>
                        <p class="text-secondary small">${doc.bio || 'Dedicated medical professional committed to excellence in patient healthcare.'}</p>
                    </div>
                    <div class="mt-3 pt-3 border-top">
                        <button class="btn btn-outline-primary w-100 fw-semibold" onclick="openBookingModal(${doc.id}, '${doc.fullName}')">
                            <i class="bi bi-calendar-plus me-1"></i> View Slots & Book
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function openBookingModal(doctorId, doctorName) {
        if (!API.isLoggedIn()) {
            window.location.href = '/login';
            return;
        }
        document.getElementById('modalDoctorName').textContent = `Book Appointment with Dr. ${doctorName}`;
        document.getElementById('modalAlert').innerHTML = '';
        document.getElementById('patientNotes').value = '';
        selectedSlotId = null;
        document.getElementById('confirmBookingBtn').disabled = true;

        const container = document.getElementById('slotsContainer');
        container.innerHTML = '<div class="spinner-border text-primary spinner-border-sm"></div> Loading slots...';
        bookingModal.show();

        try {
            const slots = await API.request(`/api/slots/doctor/${doctorId}/available`);
            if (!slots || slots.length === 0) {
                container.innerHTML = '<span class="text-muted">No open slots available for this doctor currently.</span>';
                return;
            }

            container.innerHTML = slots.map(slot => `
                <button type="button" class="btn btn-outline-secondary slot-btn" id="slot-btn-${slot.id}" onclick="selectSlot(${slot.id})">
                    <i class="bi bi-clock me-1"></i> ${slot.slotDate} (${slot.startTime.substring(0,5)} - ${slot.endTime.substring(0,5)})
                </button>
            `).join('');
        } catch (e) {
            container.innerHTML = '<span class="text-danger">Failed to retrieve slots.</span>';
        }
    }

    function selectSlot(slotId) {
        selectedSlotId = slotId;
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-outline-secondary');
        });
        const selectedBtn = document.getElementById(`slot-btn-${slotId}`);
        if (selectedBtn) {
            selectedBtn.classList.remove('btn-outline-secondary');
            selectedBtn.classList.add('btn-primary');
        }
        document.getElementById('confirmBookingBtn').disabled = false;
    }

    async function handleBooking() {
        if (!selectedSlotId) return;
        const confirmBtn = document.getElementById('confirmBookingBtn');
        confirmBtn.disabled = true;
        confirmBtn.innerText = 'Reserving slot...';

        const payload = {
            slotId: selectedSlotId,
            notes: document.getElementById('patientNotes').value.trim()
        };

        try {
            await API.request('/api/appointments/book', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            showAlert('Appointment booked successfully! Confirmation email sent.', 'success');
            bookingModal.hide();
            setTimeout(() => {
                window.location.href = '/appointments';
            }, 1000);
        } catch (err) {
            document.getElementById('modalAlert').innerHTML = `
                <div class="alert alert-danger">${err.message}</div>
            `;
            confirmBtn.disabled = false;
            confirmBtn.innerText = 'Confirm Booking';
        }
    }
</script>
</body>
</html>
